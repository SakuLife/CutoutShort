name: Multi-YouTuber Auto Shorts

on:
  schedule:
    # 毎日 15:00 JST (06:00 UTC) に実行
    - cron: '0 6 * * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  process-videos:
    runs-on: self-hosted  # セルフホストランナー（Windows）
    timeout-minutes: 120  # 最大2時間

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify environment
        shell: powershell
        run: |
          Write-Host "=== Environment Check ==="
          Write-Host "Python: $(python --version)"
          Write-Host "ffmpeg: $(ffmpeg -version 2>&1 | Select-Object -First 1)"
          Write-Host "yt-dlp: $(yt-dlp --version)"
          Write-Host "Working directory: $PWD"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create output directory
        shell: powershell
        run: |
          if (-not (Test-Path "runout")) {
            New-Item -ItemType Directory -Path "runout"
          }

      - name: Set up Google Service Account credentials
        shell: powershell
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          $jsonContent = $env:GOOGLE_SERVICE_ACCOUNT_JSON
          if (-not $jsonContent) {
            Write-Error "GOOGLE_SERVICE_ACCOUNT_JSON is not set"
            exit 1
          }

          # Parse and fix private_key format
          $jsonObj = $jsonContent | ConvertFrom-Json
          if ($jsonObj.private_key) {
            $jsonObj.private_key = $jsonObj.private_key -replace '\\n', "`n"
          }

          $jsonObj | ConvertTo-Json -Depth 10 | Set-Content -Path "service-account.json" -Encoding UTF8
          Write-Host "service-account.json created successfully"

      - name: Create .env file
        shell: powershell
        env:
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          @"
          # Multi-YouTuber Auto Shorts System

          MAKE_SHARED_SECRET=not_used_in_actions
          GOOGLE_APPLICATION_CREDENTIALS=./service-account.json
          GEMINI_API_KEY=$env:GEMINI_API_KEY
          DRIVE_OUTPUT_FOLDER_ID=$env:DRIVE_OUTPUT_FOLDER_ID
          SPREADSHEET_ID=$env:SPREADSHEET_ID
          SHEET_YOUTUBERS=YouTubers
          SHEET_UPLOAD_LOG=UploadLog
          YOUTUBE_CLIENT_ID=$env:YOUTUBE_CLIENT_ID
          YOUTUBE_CLIENT_SECRET=$env:YOUTUBE_CLIENT_SECRET

          WHISPER_MODEL=small
          WHISPER_DEVICE=cpu
          WHISPER_COMPUTE_TYPE=int8
          GEMINI_MODEL=gemini-2.0-flash

          MAX_CONCURRENT_JOBS=3
          TMP_DIR=./runout

          DOWNLOAD_TIMEOUT=600
          TRANSCRIBE_TIMEOUT=1800
          RENDER_TIMEOUT=600
          UPLOAD_TIMEOUT=600

          MAX_RETRIES=3
          RETRY_BACKOFF_BASE=2.0
          "@ | Set-Content -Path ".env" -Encoding UTF8

      - name: Set up YouTube cookies
        shell: powershell
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if ($env:YOUTUBE_COOKIES) {
            $env:YOUTUBE_COOKIES | Set-Content -Path "youtube_cookies.txt" -Encoding UTF8
            Write-Host "YouTube cookies file created"
          } else {
            Write-Host "No YouTube cookies configured"
          }

      - name: Run Multi-YouTuber scheduler
        shell: powershell
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}\service-account.json
          YOUTUBE_COOKIES_PATH: ${{ github.workspace }}\youtube_cookies.txt
        run: python -m app.multi_scheduler

      - name: Upload generated shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: |
            runout/*.mp4
            runout/*.srt
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          # 一時ファイルをクリーンアップ（オプション）
          if (Test-Path "service-account.json") { Remove-Item "service-account.json" -Force }
          if (Test-Path "youtube_cookies.txt") { Remove-Item "youtube_cookies.txt" -Force }
          Write-Host "Cleanup completed"
